.card .img-bg { background: #ffffff; padding: 10px; border-radius: 6px; display: flex; align-items: center; justify-content: center; height: 120px; }
.card img { max-width: 100%; max-height: 100px; object-fit: contain; }
.title { font-weight: bold; margin-top: 10px; font-size: 13px; word-break: break-all; color: #cbd5e1; }
</style>
</head>
